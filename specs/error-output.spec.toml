#:schema ../docs/spec.schema.json

name = "error-output"

# Error output quality — all validation errors must be clear,
# actionable, and consistently formatted.

[[criteria]]
description = """
All file paths in error messages are relative to the bundle root,
not absolute paths or bare filenames.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'relative_path or path_format'"

[[criteria]]
description = """
Output is deterministic: same input produces the same error output
every time (no randomness, no network, no external state).
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'deterministic or idempotent'"

[[criteria]]
description = """
Error messages follow a consistent format:
<relative-path>: <rule description> — <details>
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'error_format or message_format'"

