#:schema ../docs/spec.schema.json

name = "concept-fields"

# Concept document field validation beyond presence checks.
# Covers word count limits (§3b) and field type correctness (§6).

[[criteria]]
description = """
Title field must be 10 words or shorter. A title exceeding 10 words
is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'title_word_count or title_length'"

[[criteria]]
description = """
Description field must be 20 words or shorter. A description exceeding
20 words is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'description_word_count or description_length'"

[[criteria]]
description = """
Frontmatter type field must be a non-empty string. A value that is
not a string (e.g. type: 42) is an error.
"""

[criteria.verify]
type = "command"
run = "pytest tests/ -k 'type_string or type_non_string'"

# --- Agent review ---

[[criteria]]
description = """
Word limit error messages identify the field, its word count, and
the allowed maximum.
"""

[criteria.verify]
type = "agent"
prompt = """
Review okf/validate.py and tests/test_validate.py. Verify:

1. When title exceeds 10 words, the error reports the actual word count
   and the 10-word limit
2. When description exceeds 20 words, the error reports the actual word
   count and the 20-word limit
3. When type is not a string (e.g. type: 42), the error clearly states
   the field value is not a valid string
4. All error messages include the filename

Report unclear, missing, or inconsistent error messages.
"""
